[project]
name = "pyeconix"
version = "0.1.0"
description = """
    Python package for teaching and applying econometric concepts, 
    providing intuitive tools for regression analysis, statistical modeling, 
    and economic data exploration.
    """

readme = "README.md"
authors = [
    { name = "Dr.Saad.L", email = "dr.saad.laouadi@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.3",
    "statsmodels>=0.14.1",
]

[project.scripts]
pyeconix = "pyeconix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
