[project]
name = "pyeconix"
version = "0.1.0"
description = """
    Python package for teaching and applying econometric concepts, 
    providing intuitive tools for regression analysis, statistical modeling, 
    and economic data exploration.
    """

readme = "README.md"
authors = [
    { name = "Dr.Saad.L", email = "dr.saad.laouadi@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.3",
    "pandas-stubs>=2.3.0.250703",
    "scipy-stubs>=1.15.3.0",
    "statsmodels>=0.14.1",
]

[project.scripts]
pyeconix = "pyeconix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "my>=1.3.0",
    "mypy>=1.17.0",
    "ruff>=0.12.4",
]
